# Copy this file to a protected environment for production values.
[app]
database_path = "data/veille.sqlite3"
poll_interval_minutes = 30
lookback_days = 5
log_level = "INFO"

[notification]
# Une alerte n'est envoyée qu'au-dessus de ce score. Toutes les annonces restent stockées.
minimum_score = 35
recipients = []
# Délai entre deux alertes d'un même cycle. Une rafale d'e-mails identiques vers la même
# boîte est le premier motif de classement en indésirable : on les étale.
send_interval_seconds = 120
# Plafond d'envois par cycle. Le reste n'est pas perdu : il part au cycle suivant.
max_alerts_per_cycle = 12

[scoring]
keyword_weight = 30
geography_weight = 15
amount_weight = 15
deadline_weight = 15
information_weight = 10
service_weight = 15
minimum_response_days = 5
interesting_amount_eur = 20000

