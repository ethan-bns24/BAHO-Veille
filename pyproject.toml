[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baho-veille"
version = "0.1.0"
description = "Veille d'appels d'offres hôteliers pour BAHO"
requires-python = ">=3.11"

[project.scripts]
baho-veille = "veille.cli:main"

[tool.setuptools]
packages = ["veille", "veille.connectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
